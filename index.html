<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Webcam Eye Tracker</title>
<meta name="description" content="Webカメラだけで視線を推定する、ブラウザ完結のアイトラッカー">
<meta name="theme-color" content="#0d1017">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="heatmap" class="layer" aria-hidden="true"></canvas>
<canvas id="scanpath" class="layer" aria-hidden="true"></canvas>
<div id="gazeDot" class="gaze-dot hidden" aria-hidden="true"></div>

<header class="topbar">
  <h1>Webcam Eye Tracker</h1>
  <p id="status" class="status" role="status">カメラは停止中です</p>
</header>

<main class="panel">
  <section class="preview">
    <video id="video" playsinline muted></video>
    <canvas id="mesh"></canvas>
    <div id="previewHint" class="preview-hint">カメラ未接続</div>
  </section>

  <section class="controls">
    <div class="row">
      <button id="btnStart" class="primary">カメラを開始</button>
    </div>

    <div class="field">
      <label for="calMode">キャリブレーション方式</label>
      <select id="calMode">
        <option value="click">9点クリック（速い・約20秒）</option>
        <option value="pursuit">スムースパスート（点を追う・約25秒）</option>
        <option value="both" selected>両方（推奨・最も正確）</option>
        <option value="click16">16点クリック（丁寧）</option>
      </select>
    </div>

    <div class="row">
      <button id="btnCalibrate" disabled>キャリブレーション</button>
      <button id="btnValidate" disabled>精度を測る</button>
    </div>

    <div class="row">
      <button id="btnRecord" disabled>記録を開始</button>
      <button id="btnExport" disabled>CSV</button>
      <button id="btnReset" disabled>モデル消去</button>
    </div>

    <div class="row toggles">
      <label><input type="checkbox" id="chkDot" checked> 視線ドット</label>
      <label><input type="checkbox" id="chkHeatmap"> ヒートマップ</label>
      <label><input type="checkbox" id="chkScanpath"> 走査経路</label>
      <label><input type="checkbox" id="chkMesh" checked> 特徴点</label>
      <label title="クリックした場所を見ていたと仮定して、モデルを少しずつ補正します">
        <input type="checkbox" id="chkDrift"> ドリフト補正
      </label>
    </div>

    <div class="row slider">
      <label for="smoothing">スムージング</label>
      <input type="range" id="smoothing" min="0" max="100" value="55">
      <span id="smoothingValue" class="mono">55</span>
    </div>

    <dl class="stats">
      <div><dt>FPS</dt><dd id="statFps" class="mono">-</dd></div>
      <div><dt>サンプル</dt><dd id="statSamples" class="mono">0</dd></div>
      <div><dt>CV誤差</dt><dd id="statCv" class="mono">-</dd></div>
      <div><dt>検証誤差</dt><dd id="statValidation" class="mono">-</dd></div>
      <div><dt>注視点</dt><dd id="statFixations" class="mono">0</dd></div>
      <div><dt>記録</dt><dd id="statLog" class="mono">0</dd></div>
    </dl>

    <p class="note">
      映像も視線データも端末の外に出ません。すべてブラウザ内で処理しています。
      <a href="examples/embed.html">組み込み例</a>
    </p>
  </section>
</main>

<noscript>このページは JavaScript が必要です。</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
